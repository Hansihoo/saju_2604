[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suju-insight-api"
version = "0.1.0"
description = "FastAPI backend for suju-insight"
requires-python = ">=3.8"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "openai>=1.99.0,<3.0",
  "lunar_python>=1.4.8",
  "korean-lunar-calendar>=0.3.1,<1.0",
  "skyfield>=1.49,<2.0",
  "pypdf>=5.9,<6.0",
  "tzdata>=2024.1",
  "backports.zoneinfo>=0.2.1; python_version < '3.9'"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.domain.saju" = [
  "data/lunar_reference/*.jsonl",
  "data/lunar_reference/*.json",
  "data/solar_terms_reference/*.jsonl",
  "data/solar_terms_reference/*.json"
]
